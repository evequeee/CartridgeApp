services:
  postgres:
    image: postgres:16
    container_name: cartridge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cartridge
      POSTGRES_USER: cartridge
      POSTGRES_PASSWORD: cartridge
    ports:
      - "5432:5432"
    volumes:
      - cartridge-postgres-data:/var/lib/postgresql/data

volumes:
  cartridge-postgres-data:
